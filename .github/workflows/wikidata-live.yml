name: wikidata-live

# Manual check of the real Wikidata import (the test suite only uses fixtures): builds the image,
# runs the importer against the live endpoints in a hardened container, then reports counts,
# a sample of imported dishes and the smoke checks. Nothing is pushed anywhere.
on:
  workflow_dispatch:
    inputs:
      enrich:
        description: "Complete short descriptions with frwiki summaries"
        type: boolean
        default: true
      images:
        description: "Download Commons thumbnails (with licence)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plats:live
          cache-from: type=gha

      - name: Start container
        run: |
          docker run -d --name live --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e PLATS_COOKIE_SECURE=0 plats:live
          for i in $(seq 1 30); do docker exec live python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')" 2>/dev/null && break; sleep 2; done

      - name: Live import (timed)
        env:
          ENRICH: ${{ inputs.enrich }}
          IMAGES: ${{ inputs.images }}
        run: |
          args=()
          [ "$ENRICH" = "true" ] || args+=(--no-enrich)
          [ "$IMAGES" = "true" ] && args+=(--images)
          start=$(date +%s)
          docker exec live python scripts/import_wikidata.py "${args[@]}" | tee import.json
          echo "duration: $(( $(date +%s) - start )) s"
          echo "### Import summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n1 import.json >> "$GITHUB_STEP_SUMMARY"
          echo "duration: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Re-run (idempotency on live data)
        run: docker exec live python scripts/import_wikidata.py --no-enrich | tee rerun.json && python3 -c "import json; d=json.loads(open('rerun.json').read().splitlines()[-1]); assert d['created']==0, d; print('idempotent OK', d)"

      - name: Sample and quality report
        run: |
          docker exec -i live python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import random, sqlite3
          c = sqlite3.connect("/data/plats.sqlite3")
          n = c.execute("select count(*) from dishes where status='active'").fetchone()[0]
          short = c.execute("select count(*) from dishes where length(description) < 40").fetchone()[0]
          empty = c.execute("select count(*) from dishes where description = ''").fetchone()[0]
          imgs = c.execute("select count(*) from dishes where image_path != ''").fetchone()[0]
          print(f"\n### Catalogue\n\n- active dishes: {n}\n- descriptions < 40 chars: {short} (empty: {empty})\n- images: {imgs}\n")
          rows = c.execute("select title, description from dishes order by random() limit 60").fetchall()
          print("### Random sample (60)\n\n| title | description |\n|---|---|")
          for t, d in rows:
              print(f"| {t.replace('|', '/')} | {d[:110].replace('|', '/')} |")
          PY

      - name: Smoke checks on the imported catalogue
        run: docker exec live python scripts/smoke.py http://127.0.0.1:8000 --min-dishes 500

      - name: Logs
        if: always()
        run: docker logs live 2>&1 | python3 scripts/monitor_logs.py
