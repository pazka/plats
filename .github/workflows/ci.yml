name: ci

# push to main → tests → build → Trivy CRITICAL gate → push ghcr.io/pazka/plats:ci and :<sha>
# agent/** branches get the same checks without a PR (nothing is pushed to ghcr for them).
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/pazka/plats
  # Trivy is run from its image, pinned by digest (no third-party action holding a token).
  TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  test:
    # The image's Python (3.12) and the next ones, in the same slim-trixie base family as the Dockerfile.
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim-trixie
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: JS syntax check
        run: node --check app/static/app.js && node --check app/static/admin.js
      - uses: docker/setup-buildx-action@v3

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plats:scan
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate (CRITICAL, fixable)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
              plats:scan

      - name: Container smoke test (read-only, non-root, no caps)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e PLATS_COOKIE_SECURE=0 plats:scan
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break; sleep 2
          done
          docker exec smoke python -c "from app import db, services; c = db.connect('/data/plats.sqlite3'); services.create_dish(c, title='Quiche lorraine', description='Tarte salée aux lardons, servie en parts.', source='manual')"
          docker exec smoke python scripts/smoke.py http://127.0.0.1:8000
          test "$(docker exec smoke id -u)" = 10001
          docker logs smoke | tail -n 5
          docker rm -f smoke

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Browser end-to-end (Chromium, every feature, logs monitored)
        run: |
          (cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          PLAYWRIGHT_MODULE="$PWD/e2e/node_modules/playwright" e2e/run.sh plats:scan

      - name: Upload e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.sha }}
          path: e2e/out/
          retention-days: 14

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push :ci and :<sha>
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:ci
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
