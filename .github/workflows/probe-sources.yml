name: probe-sources
# TEMPORARY: dumps the structure of the new dish sources (the build sandbox cannot reach them).
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-sources.yml", ".github/probe.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/probe.py
