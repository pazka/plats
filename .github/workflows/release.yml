name: release

# tag vX.Y.Z → tests → build → Trivy CRITICAL gate → push :vX.Y.Z, :X.Y and :latest → GitHub release
# Also runnable by hand (Actions → release → Run workflow, e.g. version "v0.1.0"): the tag is then
# created on the dispatched commit together with the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pazka/plats
  TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Version from tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "bad version: $tag" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${tag#v}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: plats:scan
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate (CRITICAL, fixable)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
              plats:scan

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push :vX.Y.Z, :X.Y, :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          notes="Image: \`${IMAGE}:${tag}\` (also \`:latest\`). Deployment: see DEPLOY.md."
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$tag" --title "plats $tag" --notes "$notes" --verify-tag
          else
            gh release create "$tag" --title "plats $tag" --notes "$notes" --target "$GITHUB_SHA"
          fi

  # Box standard (Decision #16): every release goes live through hosh-deploy on the hosh.it box,
  # which verifies it and rolls back by itself. Repo variable HOSH_AUTODEPLOY=false disables this.
  deploy:
    needs: release
    if: vars.HOSH_AUTODEPLOY != 'false'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit
