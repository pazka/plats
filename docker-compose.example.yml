# Deployment behind Traefik (no secrets here). scripts/deploy.sh copies it to docker-compose.yml.
# Every site-specific value comes from plats.env, used both for interpolation and by the container:
#   docker compose --env-file plats.env up -d          (scripts/deploy.sh does this for you)
services:
  plats:
    image: ${PLATS_IMAGE:-ghcr.io/pazka/plats:v0.1.1}
    container_name: plats
    restart: unless-stopped
    env_file: ${PLATS_ENV_FILE:-./plats.env}   # chmod 600; see .env.example
    volumes:
      - plats-data:/data           # SQLite DB (+WAL), cached images, generated secrets
    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # No published port: Traefik reaches the container on the shared network, port 8000.
    expose: ["8000"]
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.plats.rule=Host(`${PLATS_HOST:-plats.hosh.it}`)
      - traefik.http.routers.plats.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.plats.tls=true
      - traefik.http.routers.plats.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}
      - traefik.http.services.plats.loadbalancer.server.port=8000
      # HSTS is set by Traefik (the app sets CSP and the other security headers itself).
      - traefik.http.middlewares.plats-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.plats-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.routers.plats.middlewares=plats-hsts

volumes:
  plats-data:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
