# Deployment on the hosh.it box (no secrets here). scripts/deploy.sh copies it to docker-compose.yml.
# Every site-specific value comes from plats.env, used both for interpolation and by the container:
#   docker compose --env-file plats.env up -d          (scripts/deploy.sh does this for you)
# Routing = hosh.it box standard: the container is published on a LOOPBACK port (PLATS_BIND) and the
# edge Traefik (host network, file provider) routes plats.hosh.it to it via deploy/traefik-route.yml.tmpl,
# which deploy.sh renders into the Traefik dynamic directory. PLATS_ROUTING=labels adds
# docker-compose.labels.yml instead (Traefik docker provider; needs Traefik >= v3.7 on the box).
services:
  plats:
    image: ${PLATS_IMAGE:-ghcr.io/pazka/plats:v0.2.4}
    container_name: plats
    restart: unless-stopped
    env_file: ${PLATS_ENV_FILE:-./plats.env}   # chmod 600; see .env.example
    volumes:
      - plats-data:/data           # SQLite DB (+WAL), cached images, generated secrets
    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Loopback only: the edge Traefik (host network) is the only client. Never 0.0.0.0.
    ports:
      - "${PLATS_BIND:-127.0.0.1:9131}:8000"

volumes:
  plats-data:
