{% extends "admin/base.html" %}
{% block title %}Journal{% endblock %}
{% block content %}
<h1>Journal des actions</h1>
<table class="table">
  <thead><tr><th>Date</th><th>Action</th><th>Détail</th><th>IP</th></tr></thead>
  <tbody>
  {% for r in rows %}
  <tr><td>{{ r.ts | dt }}</td><td>{{ r.action }}</td><td><code class="wrap">{{ r.detail }}</code></td><td><code>{{ r.ip_hash[:10] }}</code></td></tr>
  {% else %}<tr><td colspan="4" class="muted">Vide.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
