# Read ONCE by `hosh-deploy register plats` on the box (hosh.it box standard, Decision #15), which
# validates the compose hardening and pins the result in /etc/hosh-deploy/apps/plats.conf. Changing
# this file in the repo changes nothing on the box until someone re-registers there.
SERVICE=plats
IMAGE_REPO=ghcr.io/pazka/plats
IMAGE_VAR=PLATS_IMAGE
ENV_FILE=plats.env
HOST=plats.hosh.it
BIND=127.0.0.1:9131
HEALTH=/healthz
# Capability smoke inside the container after each deploy (non-zero ⇒ hosh-deploy rolls back).
POST_DEPLOY=python scripts/smoke.py http://127.0.0.1:8000 --min-dishes 500
REPO=pazka/plats
